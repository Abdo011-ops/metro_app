    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #6366f1;
            --hover: #8b5cf6;
            --border: #334155;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            padding: 15px;
            overflow: hidden;

        .container {

            text-align: center;
            position: relative;
            z-index: 1;

        /* ===== اللوجو الدائري ===== */
        .logo-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .header-title {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
            margin-bottom: 5px;
        }

        .header-title-2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* ===== السلايدر والكروت (الطريقة القديمة) ===== */
        .swiper {
            width: 100%;
            padding-bottom: 40px;
        }

        .swiper-slide {
            width: 160px;
            height: auto;
        }

        .service-card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 25px 15px;
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            height: 100%;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .service-card:active {
            transform: scale(0.95);
            border-color: var(--primary);
        }

        .service-icon {
            font-size: 45px;
            margin-bottom: 12px;
            color: var(--text);
        }

        .service-title {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 8px;
            white-space: nowrap;
        }

        .service-desc {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.4;
            white-space: normal;
        }

        .swiper-pagination-bullet {
            background: var(--muted);
            opacity: 0.5;
            width: 10px;
            height: 10px;
            transition: all 0.3s;
        }
        .swiper-pagination-bullet-active {
            background: var(--primary);
            opacity: 1;
            width: 25px;
            border-radius: 5px;
        }

        @media (min-width: 400px) {
            .swiper-slide { width: 180px; }
            .service-title { font-size: 18px; }
            .service-desc { font-size: 12px; }
            .logo-image { width: 120px; height: 120px; }

        /* ===== أزرار التواصل ===== */

            justify-content: center;
            gap: 20px;
            margin-top: 5px;

    <script>

        var swiper = new Swiper(".mySwiper", {

            grabCursor: true,

                clickable: true,
            },
        });

        // ===== منطق الصوت: يشتغل 3 ثواني بس =====
        const welcomeAudio = document.getElementById("welcomeAudio");
        
        function playAudioFor3Seconds() {
            welcomeAudio.currentTime = 0;
            welcomeAudio.play().catch(error => {
                console.log("الصوت مش قادر يشتغل:", error);
            });
            
            setTimeout(function() {
                welcomeAudio.pause();
                welcomeAudio.currentTime = 0;
            }, 3000);
        }
        
        // أول ما الصفحة تفتح، نشغل الصوت لمدة 3 ثواني
        window.addEventListener("load", function() {
            playAudioFor3Seconds();
        });
    </script>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBSAQPS5r2hi7PC7U0dp40s8--tIYKeX_o",
            authDomain: "maak-ar.firebaseapp.com",
            projectId: "maak-ar",
            storageBucket: "maak-ar.firebasestorage.app",
            messagingSenderId: "290990040235",
            appId: "1:290990040235:web:8e6af5a22ecebc652d43ee",
            measurementId: "G-CJ1G96MPH9"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        let userId = localStorage.getItem("maak_user_id");
        if (!userId) {
            userId = 'user_' + Math.random().toString(36).substr(2, 12);
            localStorage.setItem("maak_user_id", userId);
        }

        async function checkUserAccess() {
            const userRef = doc(db, "users", userId);
            
            try {
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    let data = userSnap.data();
                    
                    if (data.isBlocked === true) {
                        document.getElementById('mainContainer').style.display = 'none';
                        document.getElementById('lockScreen').style.display = 'flex';
                    }
                    else if (data.hasPaid === true) {
                        document.getElementById('lockScreen').style.display = 'none';
                    }
                    else if (data.visits >= 10) {
                        document.getElementById('mainContainer').style.display = 'none';
                        document.getElementById('lockScreen').style.display = 'flex';
                    }
                    else {
                        await updateDoc(userRef, { 
                            visits: increment(1) 
                        });
                    }
                } else {
                    await setDoc(userRef, { 
                        visits: 1, 
                        isBlocked: false,
                        hasPaid: false, 
                        createdAt: new Date()
                    });
                }
            } catch (error) {
                console.error("خطأ في الاتصال بقاعدة البيانات:", error);
            }
        }

        checkUserAccess();
    </script>
