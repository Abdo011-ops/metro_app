<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليلك | المنصة الشاملة للمواصلات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --primary: #6366f1;
            --hover: #8b5cf6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .header-title {
            font-size: 45px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary), var(--hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-subtitle {
            font-size: 20px;
            margin-bottom: 50px;
            color: #94a3b8;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .service-card {
            background: var(--card);
            border: 2px solid #334155;
            border-radius: 20px;
            padding: 40px 20px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .service-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4);
        }

        .service-icon {
            font-size: 70px;
            margin-bottom: 20px;
            transition: transform 0.3s;
        }

        .service-card:hover .service-icon {
            transform: scale(1.1);
        }

        .service-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .service-desc {
            font-size: 15px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="header-title">معاك في أي طريق</h1>
        <p class="header-subtitle">اختار الخدمة اللي بتدور عليها وهنوصلك في أسرع وقت</p>

        <div class="services-grid">
            <!-- كارت المترو -->
            <a href="metro.html" class="service-card">
                <div class="service-icon">🚇</div>
                <h2 class="service-title">دليل المترو</h2>
                <p class="service-desc">اعرف محطتك، احسب تذكرتك، وشوف مسارك في خطوط المترو.</p>
            </a>

            <!-- كارت المواقف -->
            <a href="transport.html" class="service-card">
                <div class="service-icon">🚌</div>
                <h2 class="service-title">مواصلاتي</h2>
                <p class="service-desc">دليلك لمعرفة أشهر مواقف السفر لكل محافظات مصر.</p>
            </a>
        </div>
    </div>

</body>
</html>
