<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دليلك | المنصة الشاملة للمواصلات</title>
    
    <!-- الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- مكتبة السلاسة (Swiper CSS) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />

    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #6366f1;
            --hover: #8b5cf6;
            --border: #334155;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            /* منع تحديد النص بالغلط أثناء السحب */
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            padding: 15px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* تنسيق العنوان */
        .header-title {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
            margin-bottom: 5px;
        }

        .header-title-2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* إعدادات مساحة السحب */
        .swiper {
            width: 100%;
            padding-bottom: 40px; /* مساحة للنقط اللي تحت */
        }

        .swiper-slide {
            width: 160px; /* عرض الكارت الواحد في الموبايل */
            height: auto;
        }

        /* تصميم الكارت */
        .service-card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 25px 15px;
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            height: 100%;
            transition: transform 0.2s;
        }

        .service-card:active {
            transform: scale(0.95);
            border-color: var(--primary);
        }

        .service-icon {
            font-size: 45px;
            margin-bottom: 12px;
            color: var(--text);
        }

        .service-title {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 8px;
            white-space: nowrap;
        }

        .service-desc {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.4;
            white-space: normal;
        }

        /* تنسيق النقط اللي تحت السلايدر */
        .swiper-pagination-bullet {
            background: var(--muted);
            opacity: 0.5;
            width: 10px;
            height: 10px;
            transition: all 0.3s;
        }
        .swiper-pagination-bullet-active {
            background: var(--primary);
            opacity: 1;
            width: 25px;
            border-radius: 5px;
        }

        /* للشاشات الأكبر شوية */
        @media (min-width: 400px) {
            .swiper-slide { width: 180px; }
            .service-title { font-size: 18px; }
            .service-desc { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- العنوان -->
        <h1 class="header-title">معاك</h1>
        <h2 class="header-title-2">في أي طريق</h2>
        <p class="header-subtitle">اسحب الشاشة واختار الخدمة اللي بتدور عليها</p>

        <!-- منطقة السحب (Swiper) -->
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                
                <!-- 1. كارت المترو -->
                <div class="swiper-slide">
                    <a href="metro.html" class="service-card">
                        <div class="service-icon">🚇</div>
                        <h3 class="service-title">دليل المترو</h3>
                        <p class="service-desc">اعرف محطتك واحسب تذكرتك</p>
                    </a>
                </div>

                <!-- 2. كارت المواصلات -->
                <div class="swiper-slide">
                    <a href="transport.html" class="service-card">
                        <div class="service-icon">🚌</div>
                        <h3 class="service-title">مواصلاتي</h3>
                        <p class="service-desc">دليلك لمعرفة مواقف السفر</p>
                    </a>
                </div>

                <!-- 3. كارت قطار العاصمة -->
                <div class="swiper-slide">
                    <a href="capital-train.html" class="service-card">
                        <div class="service-icon">🚈</div>
                        <h3 class="service-title">قطار العاصمة</h3>
                        <p class="service-desc">محطات القطار الكهربائي LRT</p>
                    </a>
                </div>

            </div>
            
            <!-- النقط السفلية -->
            <div class="swiper-pagination"></div>
        </div>
    </div>

    <!-- ملفات الجافاسكريبت بتاعة السلاسة (Swiper JS) -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <script>
        // كود تشغيل السحب وضبط إعداداته
        var swiper = new Swiper(".mySwiper", {
            slidesPerView: "auto", // بيخلي عرض الكارت يتضبط أوتوماتيك زي ما حددناه في الـ CSS
            spaceBetween: 15,      // المسافة بين الكروت
            grabCursor: true,      // بيغير شكل الماوس لـ "إيد بتمسك" لو فاتح من كمبيوتر
            pagination: {
                el: ".swiper-pagination",
                clickable: true,   // يخلي المستخدم يقدر يدوس على النقط للتقليب
            },
        });
    </script>
</body>
</html>
