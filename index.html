<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليلك | المنصة الشاملة للمواصلات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #6366f1;
            --hover: #8b5cf6;
            --border: #334155;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            padding: 15px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* العنوان - 3 سطور */
        .header-title {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
            margin-bottom: 5px;
        }

        .header-title-2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* الكروت - جنب بعض */
        .services-grid {
            display: flex;
            flex-direction: row;
            gap: 12px;
            justify-content: center;
            align-items: stretch;
        }

        .service-card {
            flex: 1;
            max-width: 200px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 20px 12px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--hover));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .service-card:active {
            transform: scale(0.95);
        }

        .service-card:hover::before,
        .service-card:active::before {
            opacity: 1;
        }

        .service-icon {
            font-size: 45px;
            margin-bottom: 10px;
            transition: transform 0.3s;
        }

        .service-card:active .service-icon {
            transform: scale(1.1);
        }

        .service-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .service-desc {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.5;
        }

        .service-arrow {
            margin-top: 10px;
            font-size: 16px;
            color: var(--primary);
            opacity: 0;
            transform: translateY(-5px);
            transition: all 0.3s;
        }

        .service-card:active .service-arrow {
            opacity: 1;
            transform: translateY(0);
        }

        /* للشاشات الكبيرة */
        @media (min-width: 600px) {
            .container {
                max-width: 550px;
            }

            .header-title {
                font-size: 50px;
            }

            .header-title-2 {
                font-size: 32px;
            }

            .header-subtitle {
                font-size: 16px;
            }

            .services-grid {
                gap: 20px;
            }

            .service-card {
                max-width: 220px;
                padding: 30px 20px;
                border-radius: 20px;
            }

            .service-card:hover {
                transform: translateY(-8px);
                border-color: var(--primary);
                box-shadow: 0 15px 40px rgba(99, 102, 241, 0.3);
            }

            .service-icon {
                font-size: 60px;
            }

            .service-title {
                font-size: 22px;
            }

            .service-desc {
                font-size: 13px;
            }
        }

        /* للشاشات الصغيرة جداً */
        @media (max-width: 350px) {
            .header-title {
                font-size: 32px;
            }

            .header-title-2 {
                font-size: 22px;
            }

            .header-subtitle {
                font-size: 12px;
                margin-bottom: 20px;
            }

            .services-grid {
                gap: 8px;
            }

            .service-card {
                padding: 15px 8px;
            }

            .service-icon {
                font-size: 35px;
            }

            .service-title {
                font-size: 15px;
            }

            .service-desc {
                font-size: 10px;
            }
        }

        /* دعم الوضع الليلي */
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f8fafc;
                --card: #ffffff;
                --text: #1e293b;
                --muted: #64748b;
                --border: #e2e8f0;
            }

            body {
                background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- العنوان 3 سطور -->
        <h1 class="header-title">معاك</h1>
        <h2 class="header-title-2">في أي طريق</h2>
        <p class="header-subtitle">اختار الخدمة اللي بتدور عليها وهنوصلك في أسرع وقت</p>

        <div class="services-grid">
            <!-- كارت المترو -->
            <a href="metro.html" class="service-card">
                <div class="service-icon">🚇</div>
                <h3 class="service-title">دليل المترو</h3>
                <p class="service-desc">اعرف محطتك واحسب تذكرتك</p>
                <div class="service-arrow">
                    <i class="fas fa-arrow-left"></i>
                </div>
            </a>

            <!-- كارت المواصلات -->
            <a href="transport.html" class="service-card">
                <div class="service-icon">🚌</div>
                <h3 class="service-title">مواصلاتي</h3>
                <p class="service-desc">دليلك لمواقف السفر</p>
                <div class="service-arrow">
                    <i class="fas fa-arrow-left"></i>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
