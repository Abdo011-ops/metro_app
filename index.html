    <style>
        /* باقي أكواد الـ CSS بتاعتك زي ما هي هنا ... */
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --primary: #6366f1;
            --hover: #8b5cf6;
            --border: #334155;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            padding: 15px;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* ===== اللوجو الدائري ===== */
        .logo-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .header-title {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
            margin-bottom: 5px;
        }

        .header-title-2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .swiper {
            width: 100%;
            padding-bottom: 40px;
        }

        .swiper-slide {
            width: 160px;
            height: auto;
        }

        .service-card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 25px 15px;
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            height: 100%;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .service-card:active {
            transform: scale(0.95);
            border-color: var(--primary);
        }

        .service-icon {
            font-size: 45px;
            margin-bottom: 12px;
            color: var(--text);
        }

        .service-title {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 8px;
            white-space: nowrap;
        }

        .service-desc {
            font-size: 11px;
            color: var(--muted);
            line-height: 1.4;
            white-space: normal;
        }

        .swiper-pagination-bullet {
            background: var(--muted);
            opacity: 0.5;
            width: 10px;
            height: 10px;
            transition: all 0.3s;
        }
        .swiper-pagination-bullet-active {
            background: var(--primary);
            opacity: 1;
            width: 25px;
            border-radius: 5px;
        }

        @media (min-width: 400px) {
            .swiper-slide { width: 180px; }
            .service-title { font-size: 18px; }
            .service-desc { font-size: 12px; }
            .logo-image { width: 120px; height: 120px; }
        }
 /* حاوية الأزرار عشان تخليهم جنب بعض وفي النص */
.contact-buttons {

/* التصميم الأساسي للدايرتين (المقاس والشكل) */
.circle-btn {

    <!-- ملفات الجافاسكريبت بتاعة السلاسة (Swiper JS) -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <script>
        // كود تشغيل السحب وضبط إعداداته
        var swiper = new Swiper(".mySwiper", {
            slidesPerView: "auto",
            spaceBetween: 15,
            grabCursor: true,
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
        });

        // ===== منطق الصوت: يشتغل 3 ثواني بس =====
        const welcomeAudio = document.getElementById("welcomeAudio");
        
        function playAudioFor3Seconds() {
            welcomeAudio.currentTime = 0;
            welcomeAudio.play().catch(error => {
                console.log("الصوت مش قادر يشتغل:", error);
            });
            
            setTimeout(function() {
                welcomeAudio.pause();
                welcomeAudio.currentTime = 0;
            }, 3000);
        }
        
        // أول ما الصفحة تفتح، نشغل الصوت لمدة 3 ثواني
        window.addEventListener("load", function() {
            playAudioFor3Seconds();
        });
    </script>
